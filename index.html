<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ফসল ডাক্তার</title>
<style>
  :root{
    --green:#2e7d32; --green-d:#1b5e20; --bg:#f3f7f2; --card:#fff;
    --ink:#1f2a1f; --muted:#5d6b5d; --line:#e0e8e0; --warn:#b26a00; --blue:#1565c0;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; padding-bottom:72px;
  }
  header{
    background:var(--green); color:#fff; padding:16px; text-align:center;
    position:sticky; top:0; z-index:10;
  }
  header h1{margin:0; font-size:22px}
  header p{margin:3px 0 0; font-size:13px; opacity:.9}
  .wrap{max-width:520px; margin:0 auto; padding:16px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  label{font-weight:600; font-size:14px; display:block; margin-bottom:6px}
  select,input[type=number]{
    width:100%; padding:12px; font-size:16px; border:1px solid var(--line);
    border-radius:10px; background:#fff; font-family:inherit;
  }
  .photo-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:18px; font-size:18px; font-weight:700; color:#fff;
    background:var(--green); border:none; border-radius:14px; cursor:pointer; font-family:inherit;
  }
  .photo-btn:active{background:var(--green-d)}
  .photo-btn.gallery{background:#00897b; margin-top:10px}
  .photo-btn.gallery:active{background:#00695c}
  #preview{width:100%; border-radius:12px; margin-top:12px; display:none}
  .go-btn{
    width:100%; padding:16px; font-size:18px; font-weight:700; color:#fff;
    background:#f57f17; border:none; border-radius:14px; cursor:pointer;
    margin-top:12px; font-family:inherit; display:none;
  }
  .hint{font-size:13px; color:var(--muted); text-align:center; margin-top:10px}
  #loading{display:none; text-align:center; padding:24px}
  .spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--green);
    border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .row{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .k{font-weight:700;min-width:92px;color:var(--green-d)}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700}
  .c-high{background:#e6f4e6;color:var(--green-d)}
  .c-medium{background:#fff3e0;color:var(--warn)}
  .c-low{background:#fdecea;color:#c62828}
  h3{margin:16px 0 6px;font-size:16px;color:var(--green-d)}
  ul{margin:6px 0;padding-left:20px} li{margin:4px 0}
  .warn-box{background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
  .disclaimer{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
  .speak-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    padding:16px;font-size:18px;font-weight:700;color:#fff;background:var(--blue);
    border:none;border-radius:14px;cursor:pointer;margin-bottom:14px;font-family:inherit}
  .speak-btn.stop{background:#c62828}
  .err{background:#fdecea;color:#c62828;padding:14px;border-radius:10px;text-align:center}
  .reset{width:100%;padding:14px;font-size:16px;font-weight:600;color:var(--green-d);
    background:#fff;border:2px solid var(--green);border-radius:14px;cursor:pointer;margin-top:8px;font-family:inherit}
  /* আবহাওয়া */
  .weather{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#e3f2fd,#e8f5e9);
    border:1px solid #cfe3d8;border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:14px}
  .weather .t{font-size:26px;font-weight:800;color:#0d47a1}
  .weather .adv{color:var(--green-d);font-weight:600}
  /* সাহায্য বাটন */
  .help-row{display:flex;gap:10px;margin-top:4px}
  .help-btn{flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:12px;
    font-weight:700;font-size:14px;color:#fff;border:none;cursor:pointer;font-family:inherit;line-height:1.3}
  .call{background:#2e7d32} .shop{background:#6a1b9a}
  /* প্রশ্ন ট্যাব */
  .mic-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    padding:20px;font-size:19px;font-weight:700;color:#fff;background:#c62828;border:none;
    border-radius:16px;cursor:pointer;font-family:inherit}
  .mic-btn.on{background:#8e0000;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  .qbox{background:#f1f8e9;border-radius:10px;padding:10px 12px;margin-top:12px;font-weight:600}
  .abox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
  textarea{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;
    font-family:inherit;resize:vertical;min-height:52px}
  /* ইতিহাস */
  .hist-item{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;background:#fff}
  .hist-item img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0}
  .hist-item .m{flex:1;min-width:0}
  .hist-item .d{font-weight:700;color:var(--green-d)}
  .hist-item .s{font-size:12px;color:var(--muted)}
  /* ট্যাব বার */
  .tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;
    border-top:1px solid var(--line);z-index:20}
  .tabbar button{flex:1;background:none;border:none;padding:10px 4px;font-size:12px;
    color:var(--muted);font-family:inherit;cursor:pointer}
  .tabbar button .ic{font-size:22px;display:block}
  .tabbar button.active{color:var(--green);font-weight:700}
  .page{display:none} .page.active{display:block}
</style>
</head>
<body>
<header>
  <h1>🌾 ফসল ডাক্তার</h1>
  <p>ছবি তুলুন → রোগ জানুন → পরামর্শ শুনুন</p>
</header>

<!-- ============ পরীক্ষা পেজ ============ -->
<div class="wrap page active" id="page-test">

  <div class="weather" id="weather" style="display:none"></div>

  <div class="card" id="inputCard">
    <label for="crop">ফসল বেছে নিন (ঐচ্ছিক)</label>
    <select id="crop">
      <option value="">— জানি না / অটো —</option>
      <option>ধান</option><option>আলু</option><option>টমেটো</option><option>গম</option>
      <option>ভুট্টা</option><option>বেগুন</option><option>মরিচ</option><option>পাট</option>
      <option>আম</option><option>কলা</option>
    </select>

    <div style="height:12px"></div>
    <label for="land">জমির পরিমাণ (শতক) — ঐচ্ছিক</label>
    <input type="number" id="land" min="0" placeholder="যেমন: ১০" inputmode="numeric">

    <div style="height:14px"></div>
    <button class="photo-btn" onclick="document.getElementById('cam').click()">📷 ক্যামেরায় ছবি তুলুন</button>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden>
    <button class="photo-btn gallery" onclick="document.getElementById('gal').click()">🖼️ গ্যালারি থেকে দিন</button>
    <input type="file" id="gal" accept="image/*" hidden>

    <img id="preview" alt="ছবি">
    <button class="go-btn" id="goBtn" onclick="analyze()">🔍 রোগ দেখুন</button>
    <p class="hint">আক্রান্ত পাতাটা কাছ থেকে, পরিষ্কার আলোয় তুলুন</p>
  </div>

  <div id="loading" class="card"><div class="spin"></div><div>পরীক্ষা করা হচ্ছে... একটু অপেক্ষা করুন</div></div>
  <div id="result"></div>

  <div class="card">
    <label>দ্রুত সাহায্য</label>
    <div class="help-row">
      <a class="help-btn call" href="tel:16123">📞 কৃষি কল সেন্টার<br>১৬১২৩</a>
      <button class="help-btn shop" onclick="openShops()">🏪 কৃষি দোকান<br>দেখুন</button>
    </div>
  </div>
</div>

<!-- ============ প্রশ্ন পেজ ============ -->
<div class="wrap page" id="page-ask">
  <div class="card">
    <label>🎤 কথা বলে প্রশ্ন করুন</label>
    <p class="hint" style="text-align:left;margin-top:0">যেমন: "আমার ধানের পাতা হলুদ হয়ে যাচ্ছে কেন?"</p>
    <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤 চেপে কথা বলুন</button>
    <div style="height:10px"></div>
    <textarea id="qtext" placeholder="অথবা এখানে প্রশ্ন লিখুন..."></textarea>
    <button class="go-btn" style="display:block;background:var(--green)" onclick="sendQuestion()">প্রশ্ন পাঠান</button>
    <div id="qLoading" style="display:none;text-align:center;padding:14px"><div class="spin"></div>উত্তর আসছে...</div>
    <div id="answer"></div>
  </div>
</div>

<!-- ============ ইতিহাস পেজ ============ -->
<div class="wrap page" id="page-hist">
  <div class="card">
    <label>📋 আগের রিপোর্টসমূহ</label>
    <div id="histList"><p class="hint">লোড হচ্ছে...</p></div>
  </div>
  <div id="histDetail"></div>
</div>

<!-- ============ দোকান পেজ ============ -->
<div class="wrap page" id="page-shops">
  <div class="card">
    <button class="reset" style="margin:0 0 12px" onclick="showTab('test')">← ফিরে যান</button>
    <label>🏪 কৃষি দোকান</label>
    <input type="text" id="shopSearch" placeholder="🔍 এলাকা বা দোকানের নাম লিখুন" oninput="renderShops()"
      style="width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;margin-top:6px">
    <div id="shopList" style="margin-top:14px"><p class="hint">লোড হচ্ছে...</p></div>
  </div>
</div>

<!-- ============ ট্যাব বার ============ -->
<div class="tabbar">
  <button class="active" data-tab="test" onclick="showTab('test')"><span class="ic">🌱</span>পরীক্ষা</button>
  <button data-tab="ask" onclick="showTab('ask')"><span class="ic">💬</span>প্রশ্ন</button>
  <button data-tab="hist" onclick="showTab('hist')"><span class="ic">📋</span>ইতিহাস</button>
</div>

<script>
let imgFile = null;

/* ---------- ট্যাব ---------- */
function showTab(name){
  stopSpeak();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  if(name==='hist') loadHistory();
  window.scrollTo(0,0);
}

/* ---------- ছবি নির্বাচন ---------- */
function handleFile(e){
  const f = e.target.files[0]; if(!f) return;
  imgFile = f;
  const img = document.getElementById('preview');
  img.src = URL.createObjectURL(f); img.style.display='block';
  document.getElementById('goBtn').style.display='block';
}
document.getElementById('cam').addEventListener('change', handleFile);
document.getElementById('gal').addEventListener('change', handleFile);

/* ---------- বিশ্লেষণ ---------- */
async function analyze(){
  if(!imgFile){ alert('আগে একটা ছবি দিন'); return; }
  stopSpeak();
  document.getElementById('inputCard').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('loading').style.display='block';

  const fd = new FormData();
  fd.append('image', imgFile);
  fd.append('crop', document.getElementById('crop').value);
  fd.append('land', document.getElementById('land').value);

  try{
    const res = await fetch('/analyze', {method:'POST', body:fd});
    const json = await res.json();
    document.getElementById('loading').style.display='none';
    if(json.ok){ showResult(json.data, document.getElementById('result'), true); }
    else { showError(json.error || 'সমস্যা হয়েছে'); }
  }catch(err){
    document.getElementById('loading').style.display='none';
    showError('নেট বা সার্ভারে সমস্যা। আবার চেষ্টা করুন।');
  }
}

function showError(msg){
  const box = document.getElementById('result');
  box.style.display='block';
  box.innerHTML = `<div class="card"><div class="err">❌ ${msg}</div>
    <button class="reset" onclick="resetApp()">↺ আবার চেষ্টা করুন</button></div>`;
}

function reportHTML(d, withReset){
  if(d.is_plant === false){
    return `<div class="card"><div class="err">❌ ছবিতে ফসল/পাতা পাওয়া যায়নি। স্পষ্ট করে আবার তুলুন।</div>
      ${withReset?'<button class="reset" onclick="resetApp()">↺ আবার চেষ্টা করুন</button>':''}</div>`;
  }
  const cMap={high:['উচ্চ','c-high'],medium:['মাঝারি','c-medium'],low:['কম','c-low']};
  const c=cMap[d.confidence]||[d.confidence||'-','c-medium'];
  const protikar=(d.protikar||[]).map(x=>`<li>${x}</li>`).join('');
  const osudh=(d.sar_osudh||[]).map(x=>`<li>${x}</li>`).join('');
  return `<div class="card">
    <button class="speak-btn" id="speakBtn" onclick="toggleSpeak()">🔊 রিপোর্ট শুনুন</button>
    <div class="row"><span class="k">🌱 ফসল</span><span>${d.fosol||'-'}</span></div>
    <div class="row"><span class="k">🦠 রোগ</span><span>${d.rog_naam||'-'}</span></div>
    <div class="row"><span class="k">📊 নিশ্চয়তা</span><span class="pill ${c[1]}">${c[0]}</span></div>
    <h3>🔍 লক্ষণ</h3><div>${d.lokkhon||'-'}</div>
    <h3>❓ কারণ</h3><div>${d.karon||'-'}</div>
    <h3>✅ করণীয়</h3><ul>${protikar}</ul>
    <h3>💊 সার / ওষুধ</h3><ul>${osudh}</ul>
    ${d.sotorkota?`<div class="warn-box">🛡️ <b>সতর্কতা:</b> ${d.sotorkota}</div>`:''}
    ${d.officer_dekhano_uchit?`<div class="warn-box">👨‍🌾 নিশ্চিত হতে স্থানীয় কৃষি অফিসারকে ছবিটি দেখান।</div>`:''}
    <div class="disclaimer">⚠️ এটি AI পরামর্শ, চূড়ান্ত সিদ্ধান্ত নয়। ওষুধ ব্যবহারের আগে কৃষি অফিসার/ডিলারের সাথে যাচাই করুন।</div>
    ${withReset?'<button class="reset" onclick="resetApp()">↺ নতুন ছবি দেখুন</button>':''}
  </div>`;
}

function showResult(d, box, autoSpeak){
  box.style.display='block';
  box.innerHTML = reportHTML(d, true);
  window._reportText = buildSpeech(d);
  if(autoSpeak && d.is_plant !== false) setTimeout(startSpeak, 400);
}

function buildSpeech(d){
  if(d.is_plant === false) return 'ছবিতে ফসল পাওয়া যায়নি।';
  let t=`ফসল ${d.fosol||''}। রোগ, ${d.rog_naam||''}। `;
  if(d.lokkhon) t+=`লক্ষণ। ${d.lokkhon} `;
  if(d.karon) t+=`কারণ। ${d.karon} `;
  if((d.protikar||[]).length) t+=`করণীয়। `+d.protikar.join('। ')+'। ';
  if((d.sar_osudh||[]).length) t+=`সার ও ওষুধ। `+d.sar_osudh.join('। ')+'। ';
  if(d.sotorkota) t+=`সতর্কতা। ${d.sotorkota} `;
  return t;
}

/* ---------- বাংলা ভয়েস + স্ক্রিন জাগিয়ে রাখা ---------- */
let speaking=false, wakeLock=null;

async function keepAwake(){
  try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){}
}
function releaseAwake(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }
// পর্দা ফিরে এলে, তখনও কথা চললে আবার জাগিয়ে রাখি
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && speaking) keepAwake();
});

function pickBanglaVoice(){
  const vs=speechSynthesis.getVoices();
  return vs.find(v=>/bn[-_]?/i.test(v.lang)) || vs.find(v=>/bengali|bangla/i.test(v.name)) || null;
}
function startSpeak(){
  if(!window._reportText || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(window._reportText);
  const v=pickBanglaVoice();
  if(v){ u.voice=v; u.lang=v.lang; } else u.lang='bn-BD';
  u.rate=0.95;
  u.onend=()=>{ setSpeakBtn(false); releaseAwake(); };
  u.onerror=()=>{ setSpeakBtn(false); releaseAwake(); };
  keepAwake();                 // ← রিপোর্ট শোনার সময় ফোন স্লিপে যাবে না
  speechSynthesis.speak(u);
  setSpeakBtn(true);
}
function stopSpeak(){ if('speechSynthesis' in window) speechSynthesis.cancel(); setSpeakBtn(false); releaseAwake(); }
function toggleSpeak(){ speaking ? stopSpeak() : startSpeak(); }
function setSpeakBtn(on){
  speaking=on;
  const b=document.getElementById('speakBtn'); if(!b) return;
  b.textContent = on?'⏹ থামান':'🔊 রিপোর্ট শুনুন';
  b.classList.toggle('stop', on);
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=()=>{}; }

function resetApp(){
  stopSpeak(); imgFile=null;
  document.getElementById('cam').value=''; document.getElementById('gal').value='';
  document.getElementById('preview').style.display='none';
  document.getElementById('goBtn').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('inputCard').style.display='block';
  window.scrollTo(0,0);
}

/* ---------- ভয়েসে প্রশ্ন (Speech-to-Text) ---------- */
let recog=null, listening=false;
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('এই ব্রাউজারে ভয়েস প্রশ্ন নেই। নিচে লিখে প্রশ্ন করুন।'); return; }
  if(listening){ recog && recog.stop(); return; }
  recog = new SR();
  recog.lang='bn-BD'; recog.interimResults=false; recog.maxAlternatives=1;
  recog.onstart=()=>{ listening=true; document.getElementById('micBtn').classList.add('on');
    document.getElementById('micBtn').textContent='🎙️ শুনছি... থামতে চাপুন'; };
  recog.onresult=(e)=>{
    const text=e.results[0][0].transcript;
    document.getElementById('qtext').value=text;
    sendQuestion();
  };
  recog.onerror=()=>{ alert('শুনতে পারিনি, আবার চেষ্টা করুন বা লিখে দিন।'); };
  recog.onend=()=>{ listening=false; document.getElementById('micBtn').classList.remove('on');
    document.getElementById('micBtn').textContent='🎤 চেপে কথা বলুন'; };
  recog.start();
}

async function sendQuestion(){
  const q=document.getElementById('qtext').value.trim();
  if(!q){ alert('প্রশ্ন লিখুন বা বলুন'); return; }
  stopSpeak();
  document.getElementById('answer').innerHTML='';
  document.getElementById('qLoading').style.display='block';
  try{
    const res=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q})});
    const json=await res.json();
    document.getElementById('qLoading').style.display='none';
    if(json.ok){
      document.getElementById('answer').innerHTML=
        `<div class="qbox">❓ ${q}</div>
         <div class="abox">${json.answer.replace(/\n/g,'<br>')}</div>
         <button class="speak-btn" id="speakBtn" style="margin-top:12px" onclick="toggleSpeak()">🔊 উত্তর শুনুন</button>`;
      window._reportText=json.answer;
      setTimeout(startSpeak,300);
    } else {
      document.getElementById('answer').innerHTML=`<div class="err">❌ ${json.error}</div>`;
    }
  }catch(e){
    document.getElementById('qLoading').style.display='none';
    document.getElementById('answer').innerHTML=`<div class="err">❌ সার্ভারে সমস্যা।</div>`;
  }
}

/* ---------- ইতিহাস ---------- */
async function loadHistory(){
  const list=document.getElementById('histList');
  document.getElementById('histDetail').innerHTML='';
  list.innerHTML='<p class="hint">লোড হচ্ছে...</p>';
  try{
    const res=await fetch('/history'); const json=await res.json();
    if(!json.ok || !json.items.length){ list.innerHTML='<p class="hint">এখনো কোনো রিপোর্ট নেই।</p>'; return; }
    list.innerHTML = json.items.map((it,i)=>`
      <div class="hist-item" onclick='showHist(${i})'>
        <img src="/saved/${it.image}" alt="">
        <div class="m">
          <div class="d">${it.rog_naam||it.fosol||'রিপোর্ট'}</div>
          <div class="s">${it.fosol||''} · ${it.time||''}</div>
        </div>
      </div>`).join('');
    window._hist=json.items;
  }catch(e){ list.innerHTML='<p class="hint">ইতিহাস লোড করা যায়নি।</p>'; }
}
function showHist(i){
  const it=window._hist[i]; if(!it) return;
  const box=document.getElementById('histDetail');
  box.innerHTML = `<div class="card"><img src="/saved/${it.image}" style="width:100%;border-radius:12px;margin-bottom:10px"></div>`
    + reportHTML(it.report, false);
  window._reportText=buildSpeech(it.report);
  box.scrollIntoView({behavior:'smooth'});
}

/* ---------- আবহাওয়া পরামর্শ (ফ্রি, Open-Meteo) ---------- */
function loadWeather(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:la, longitude:lo}=pos.coords;
    try{
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}`
        +`&current=temperature_2m,precipitation&daily=precipitation_probability_max&timezone=auto`;
      const r=await fetch(url); const j=await r.json();
      const temp=Math.round(j.current.temperature_2m);
      const rain=j.daily.precipitation_probability_max?.[0] ?? 0;
      let adv = rain>=60 ? '🌧️ আজ বৃষ্টির সম্ভাবনা বেশি — স্প্রে করা থেকে বিরত থাকুন।'
              : rain>=30 ? '⛅ হালকা বৃষ্টি হতে পারে — স্প্রে করলে সকালে করুন।'
              : '☀️ আবহাওয়া শুষ্ক — স্প্রে/সার প্রয়োগের জন্য ভালো সময়।';
      const w=document.getElementById('weather');
      w.style.display='flex';
      w.innerHTML=`<div class="t">${temp}°</div><div><div>আজকের আবহাওয়া · বৃষ্টির সম্ভাবনা ${rain}%</div>
        <div class="adv">${adv}</div></div>`;
    }catch(e){}
  }, ()=>{}, {timeout:8000});
}

/* ---------- কৃষি দোকান (এলাকাভিত্তিক) ---------- */
let allShops = [];
async function openShops(){
  showTab('shops');
  document.getElementById('shopList').innerHTML='<p class="hint">লোড হচ্ছে...</p>';
  try{
    const r=await fetch('/shops'); const j=await r.json();
    allShops = j.items || [];
    renderShops();
  }catch(e){ document.getElementById('shopList').innerHTML='<p class="hint">দোকান লোড করা যায়নি।</p>'; }
}
function renderShops(){
  const q=(document.getElementById('shopSearch').value||'').trim().toLowerCase();
  const el=document.getElementById('shopList');
  if(!allShops.length){
    el.innerHTML='<p class="hint">এখনো কোনো দোকান যোগ করা হয়নি।<br>অ্যাডমিন পেজ থেকে দোকান যোগ করুন।</p>';
    return;
  }
  const items = allShops.filter(s=>
    !q || (s.area||'').toLowerCase().includes(q) || (s.name||'').toLowerCase().includes(q));
  if(!items.length){ el.innerHTML='<p class="hint">এই এলাকায় কোনো দোকান পাওয়া যায়নি।</p>'; return; }
  el.innerHTML = items.map(s=>`
    <div class="card" style="margin-bottom:12px;padding:14px">
      <div style="font-weight:700;color:var(--green-d);font-size:16px">🏪 ${s.name}</div>
      <div style="font-size:14px;color:var(--muted);margin:4px 0">📍 ${s.area}</div>
      ${s.address?`<div style="font-size:13px;color:var(--muted)">${s.address}</div>`:''}
      <div class="help-row" style="margin-top:10px">
        ${s.phone?`<a class="help-btn call" href="tel:${s.phone}">📞 কল করুন</a>`:''}
        ${s.map?`<a class="help-btn shop" href="${s.map}" target="_blank">🗺️ ম্যাপে দেখুন</a>`:''}
      </div>
    </div>`).join('');
}

window.addEventListener('load', loadWeather);
</script>
